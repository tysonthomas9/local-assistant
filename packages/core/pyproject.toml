[project]
name = "assistant-core"
version = "0.1.0"
description = "Config loader, logging and clock shared by brain, edge and CLI"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.9,<3", "pydantic-settings>=2.6,<3", "structlog>=24.4"]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
