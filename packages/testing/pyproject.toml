[project]
name = "assistant-testing"
version = "0.1.0"
description = "Fakes and test helpers (never imported by production packages)"
requires-python = ">=3.12,<3.13"
dependencies = ["assistant-contracts", "assistant-core"]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.sources]
assistant-contracts = { workspace = true }
assistant-core = { workspace = true }
