[project]
name = "assistant-robot-reachy"
version = "0.1.0"
description = "ReachyBody: the only package that imports reachy_mini"
requires-python = ">=3.12,<3.13"
dependencies = ["assistant-contracts", "assistant-core", "numpy>=2.2.5", "reachy-mini==1.10.0"]

[project.entry-points."assistant.bodies"]
reachy = "assistant_robot_reachy.body:ReachyBody"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.sources]
assistant-contracts = { workspace = true }
assistant-core = { workspace = true }
