[project]
name = "assistant-link"
version = "0.1.0"
description = "EdgeLink v1 WebSocket server and client"
requires-python = ">=3.12,<3.13"
dependencies = ["assistant-contracts", "assistant-core", "websockets>=15,<16"]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.sources]
assistant-contracts = { workspace = true }
assistant-core = { workspace = true }
