# Development on one machine: loopback only, our own Ollama on GPU0 (scripts/llm_server.sh), readable logs.

[net]
edgelink_bind = "127.0.0.1:8770"

[llm]
impl = "openai"
base_url = "http://127.0.0.1:8773/v1"    # our Ollama (scripts/llm_server.sh) until vLLM (phase 2)
model = "reachy-gemma4"

[edge]
body = "console"

[edge.audio]
aec = "none"

[observability]
log_level = "debug"
log_format = "console"
