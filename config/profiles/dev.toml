# Development on one machine: loopback only, the local Ollama, readable logs.

[net]
edgelink_bind = "127.0.0.1:8770"

[llm]
impl = "openai"
base_url = "http://127.0.0.1:11434/v1"   # Ollama until vLLM is up (phase 2)
model = "reachy-gemma4"

[edge]
body = "console"

[edge.audio]
aec = "none"

[observability]
log_level = "debug"
log_format = "console"
