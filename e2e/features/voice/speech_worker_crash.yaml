feature: A speech model crash mid-reply is apologised for and recovered from by itself
tier: models
description: >
  The speech server runs its models in a worker process under a supervisor that holds the
  port: a native crash (GGML's CUDA abort in the TTS) takes the whole worker with it and
  cannot be caught in Python. The brain (basic engine, the real LLM reachy-gemma4) speaks a
  long reply through a speech server of the scenario's own, whose worker is killed for real
  (SIGKILL) while a TTS stream sends audio. The reply that had begun ends and the turn does not
  hang: the user is told the
  speech server cannot be reached (speak text) and the turn log records the error. Nobody
  restarts anything: the supervisor starts a new worker on the same port and the next reply is
  spoken again. A shared speech server is never touched.
scenarios:
  - name: the speech worker dies mid-reply; the turn says so and the next one is spoken
    steps:
      - llm_serves
      - start_speech_server
      - start_brain: {engine: basic, speech: true}
      - start_edge_agent: {id: desk}
      - edge_types: {client: desk, text: "What is the capital of Italy? Answer in one word."}
      - robot_speaks_reply: {client: desk, min_ms: 300}
      - edge_shows_reply: {client: desk, containing: Rome}
      - turn_logged: {kind: text, outcome: finished, ttft: true}
      - edge_types: {client: desk, text: "Tell me about Rome in five long sentences."}
      - crash_speech_worker: {during: tts}
      - edge_shows_reply: {client: desk, containing: Rome}
      - edge_shows_reply: {client: desk, containing: "can't reach my speech server", within_s: 60}
      - turn_logged: {kind: text, outcome: error, error_contains: "127.0.0.1"}
      - speech_server_restarted: {within_s: 180}
      - edge_types: {client: desk, text: "What is the capital of Spain? Answer in one word."}
      - robot_speaks_reply: {client: desk, min_ms: 300}
      - edge_shows_reply: {client: desk, containing: Madrid}
      - turn_logged: {kind: text, outcome: finished, ttft: true}
      - edge_output_clean: desk
