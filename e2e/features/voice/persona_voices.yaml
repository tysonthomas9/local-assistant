feature: Each assistant speaks in its own voice
tier: models
description: >
  The voice follows the assistant the wake word chose (config/assistants/<id>.toml
  voice.speaker): after "hey jarvis" the reply is spoken by the speech server as ryan, after
  "hey marvin" as eric. Real brain, the real LLM (vLLM by default) reachy-gemma4, real speech server on GPU1.
scenarios:
  - name: Jarvis speaks as Ryan and Marvin as Eric
    steps:
      - llm_serves
      - speech_server_running
      - start_brain: {engine: basic, speech: true, follow_up_s: 0}
      - start_edge_agent: {id: desk}
      - edge_types: {client: desk, text: /wake hey_jarvis 0.9}
      - edge_types: {client: desk, text: "Say hello in five words or fewer."}
      - robot_speaks_reply: {client: desk, min_ms: 300}
      - turn_logged: {kind: text}
      - speech_server_used_voice: {voice: ryan}
      - edge_types: {client: desk, text: /wake hey_marvin 0.9}
      - edge_types: {client: desk, text: "Say goodbye in five words or fewer."}
      - robot_speaks_reply: {client: desk, min_ms: 300}
      - turn_logged: {kind: text}
      - speech_server_used_voice: {voice: eric}
      - brain_output_clean
      - edge_output_clean: desk
