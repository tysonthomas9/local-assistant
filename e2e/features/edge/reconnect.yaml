feature: The edge agent survives link faults
tier: core
description: >
  Real faults on the real edge agent process. When the brain (here the link server console)
  is killed and started again, the agent reconnects on its own with the link's backoff and
  keeps working. When the agent itself is killed and restarted, the brain gets a new session.
  A frozen agent (SIGSTOP) is dropped by the heartbeat and reconnects when thawed.
scenarios:
  - name: the brain is killed and restarted; the agent reconnects and still works
    steps:
      - start_link_server
      - start_edge_agent: {id: desk}
      - kill_process: {process: server}
      - restart_process: {process: server}
      - client_reconnects_within: {client: desk, seconds: 3}
      - client_retries_with_backoff: {client: desk, min_retries: 1}
      - edge_types: {client: desk, text: are you back}
      - server_receives: {client: desk, type: text.input, fields: {text: are you back}}
      - edge_answers: {client: desk, type: play_sound, fields: {sound_id: chime}, ok: false}

  - name: the agent is killed and restarted; the brain gets a new session
    steps:
      - start_link_server
      - start_edge_agent: {id: desk}
      - kill_process: {process: desk}
      - server_disconnects: {client: desk, within_s: 10}
      - restart_process: {process: desk}
      - server_connected: {client: desk, within_s: 30}
      - client_receives: {client: desk, type: welcome, within_s: 10}
      - press_push_to_talk: desk
      - server_receives: {client: desk, type: vad, fields: {state: start}}

  - name: a frozen agent is dropped by the heartbeat and reconnects when thawed
    steps:
      - start_link_server
      - start_edge_agent: {id: desk}
      - kill_process: {process: desk, signal_name: STOP}
      - server_disconnects: {client: desk, within_s: 20, not_before_s: 10}
      - kill_process: {process: desk, signal_name: CONT}
      - client_reconnects_within: {client: desk, seconds: 12}
      - edge_types: {client: desk, text: thawed}
      - server_receives: {client: desk, type: text.input, fields: {text: thawed}}
