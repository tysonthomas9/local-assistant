feature: The edge agent connects and talks to the brain
tier: core
description: >
  The real edge agent (`python -m assistant_edge`) with the console body connects to a real
  link server console over EdgeLink on 127.0.0.1. Its hello announces the body. Typed text
  becomes text.input. Push-to-talk (typed into the agent's stdin, the same way a key does it)
  opens and closes a mic window with vad start and end. Speech the server streams is played
  against the edge's real-time playback clock (started, progress, done, with played_ms), and
  pressing push-to-talk while it plays is a barge-in: the edge flushes its own speaker first
  and then reports vad{barge_in, stream_id, played_ms} and playback{flushed}.
scenarios:
  - name: the agent says hello with its body and is welcomed
    steps:
      - start_link_server
      - start_edge_agent: {id: desk, body: console}
      - edge_body_is: {client: desk, aec: none, camera: false, expressions: ["yes", "no", happy]}
      - edge_output_clean: desk

  - name: typed text reaches the brain as text.input
    steps:
      - start_link_server
      - start_edge_agent: {id: desk}
      - edge_types: {client: desk, text: what time is it}
      - server_receives: {client: desk, type: text.input, fields: {text: what time is it}}
      - edge_output_clean: desk

  - name: push-to-talk opens and closes a mic window
    steps:
      - start_link_server
      - start_edge_agent: {id: desk}
      - press_push_to_talk: desk
      - server_receives: {client: desk, type: vad, fields: {state: start, barge_in: false}}
      - release_push_to_talk: desk
      - server_receives: {client: desk, type: vad, fields: {state: end}}
      - uplink_carries_no_audio: {client: desk, seconds: 1}
      - edge_output_clean: desk

  - name: streamed speech plays in real time and the playback clock reports it
    steps:
      - start_link_server
      - start_edge_agent: {id: desk}
      - server_streams_speech: {client: desk, stream: 7, clip: "tone:440:1.5", text: hello there}
      - playback_reported: {client: desk, stream: 7, state: started}
      - playback_reported: {client: desk, stream: 7, state: progress, min_played_ms: 100}
      - playback_reported: {client: desk, stream: 7, state: done, within_s: 5}
      - playback_paced: {client: desk, stream: 7, ms: 1500}
      - edge_output_clean: desk

  - name: push-to-talk during speech is a barge-in; the edge flushes locally first
    steps:
      - start_link_server
      - start_edge_agent: {id: desk}
      - server_streams_speech: {client: desk, stream: 9, clip: "tone:330:4"}
      - playback_reported: {client: desk, stream: 9, state: progress, min_played_ms: 400}
      - press_push_to_talk: desk
      - playback_stops_within: {client: desk, stream: 9, ms: 50, local: true}
      - barge_in_reported: {client: desk, stream: 9, min_played_ms: 400, max_played_ms: 3500}
      - release_push_to_talk: desk
      - edge_output_clean: desk

  - name: the brain's flush stops speech; the agent drops late frames of that stream
    steps:
      - start_link_server
      - start_edge_agent: {id: desk}
      - server_streams_speech: {client: desk, stream: 11, clip: "tone:500:4"}
      - playback_reported: {client: desk, stream: 11, state: started}
      - server_sends: {client: desk, type: flush, fields: {stream_id: 11}}
      - playback_stops_within: {client: desk, stream: 11, ms: 50, local: false}
      - edge_output_clean: desk
