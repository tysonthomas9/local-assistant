feature: A dead vLLM is spoken about, not hidden
tier: models
description: >
  The same as turn/llm_down, on vLLM (the default server): a real vLLM of the scenario's own on
  GPU0 (scripts/llm_server.sh --server vllm, on its own loopback port; the stack's vLLM sleeps
  meanwhile) is killed for real (SIGKILL of the API server and its engine core) between two
  turns. The next turn fails fast: the user is told the language model cannot be reached
  (speak text), the turn log records the error, and attention goes back to idle. Once vLLM is
  started again on the same port, the next turn is answered again.
scenarios:
  - name: vLLM dies; the turn says so and the next one works once it is back
    steps:
      - start_llm_server: {server: vllm}
      - start_brain: {engine: basic, llm: test}
      - start_edge_agent: {id: desk}
      - edge_types: {client: desk, text: "What is the capital of Italy? Answer in one word."}
      - edge_shows_reply: {client: desk, containing: Rome, within_s: 180}
      - turn_logged: {kind: text, ttft: true}
      - kill_llm_server
      - attention_sequence_is: {client: desk, states: [idle, listening, thinking, speaking, idle]}
      - edge_types: {client: desk, text: "Are you still there?"}
      - edge_shows_reply: {client: desk, containing: "can't reach my language model", within_s: 15}
      - attention_sequence_is: {client: desk, states: [listening, thinking, speaking, idle]}
      - turn_logged: {kind: text, outcome: error, error_contains: "127.0.0.1"}
      - restart_llm_server
      - edge_types: {client: desk, text: "What is the capital of Spain? Answer in one word."}
      - edge_shows_reply: {client: desk, containing: Madrid, within_s: 180}
      - turn_logged: {kind: text, outcome: finished, ttft: true}
      - edge_output_clean: desk
