feature: The robot's head follows the turn
tier: [hw, models]
description: >
  The real brain (basic engine, real LLM) drives the real robot through the edge agent on the
  robot's machine. A typed question makes the turn run idle -> listening -> thinking ->
  speaking -> idle, and the body shows each state with a small, slow head pose from neutral
  (listening: pitch -5 degrees; thinking: roll 7, pitch -3; speaking: neutral; each reached
  over one second, never more than 10 degrees). A robot at rest wakes up with the SDK's
  wake_up() for the turn and goes back with goto_sleep() and motors off at idle. Measured by a
  sampler next to the daemon (not over the tunnel): every pose within 2.5 degrees of its target.
scenarios:
  - name: attention poses follow a real turn and the robot goes back to rest
    steps:
      - robot_host_found
      - code_synced_to_edge_host
      - start_reachy_daemon
      - start_brain: {engine: basic}
      - start_edge_agent: {id: lite, body: reachy, where: edge_host}
      - robot_state_read: {control_mode: disabled}
      - robot_pose_follows: {client: lite, text: "What colour is the sky on a clear day? Answer in one word.", states: [listening, thinking, speaking, idle]}
      - edge_shows_reply: {client: lite, containing: blue, within_s: 60}
      - robot_back_at_rest
      - robot_state_read: {control_mode: disabled}
      - brain_output_clean
      - edge_output_clean: lite
      - edge_host_clean
