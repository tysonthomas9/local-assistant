feature: The robot hears a question and answers it aloud
tier: [hw, models]
description: >
  The full voice loop on the real robot. The golden "hello" WAV is fed into the robot's edge
  agent as real 20 ms mic frames at its mic input point (right after capture; spec "testing
  rule": voice input). The agent's energy trigger opens a mic window (with its pre-roll) and
  closes it after 700 ms of quiet; the real brain transcribes the utterance (Parakeet on GPU1),
  asks the real LLM (Ollama reachy-gemma4) and speaks the reply (Qwen3-TTS, voice ryan) on the
  robot's speaker. The reply the speaker was given transcribes to non-empty text. The time
  from the end of speech to the speaker's first audio and the turn's timings are written as
  an artifact.
scenarios:
  - name: golden hello -> STT -> LLM -> TTS -> the robot's speaker
    steps:
      - robot_host_found
      - code_synced_to_edge_host
      - ollama_serves
      - speech_server_running
      - start_reachy_daemon
      - start_brain: {engine: basic, speech: true}
      - start_edge_agent: {id: lite, body: reachy, where: edge_host, energy_trigger_dbfs: -35, vad_end_ms: 700, record: true}
      - feed_golden_wav: {client: lite, name: hello}
      - voice_turn_transcribed: {client: lite, max_wer: 0.2}
      - robot_speaks_reply: {client: lite, min_ms: 500}
      - turn_logged: {kind: voice, ttft: true}
      - recorded_reply_transcript_not_empty: {client: lite}
      - timings_recorded: {name: voice_loop}
      - brain_output_clean
      - edge_output_clean: lite
      - edge_host_clean
