[project]
name = "dx-personaplex"
version = "0.1.0"
description = "DX-POC adapter env: NVIDIA PersonaPlex-7B (moshi fork, pinned commit)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "moshi-personaplex",
    "torch==2.4.1",
    "numpy==2.1.3",
    "scipy==1.14.1",
    "soundfile==0.13.1",
    "accelerate==1.10.1",
]

[tool.uv.sources]
moshi-personaplex = { url = "https://github.com/NVIDIA/personaplex/archive/3428dfd95309a7f3c84fd93259ded0f810d1ff91.tar.gz", subdirectory = "moshi" }
torch = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv]
package = false
