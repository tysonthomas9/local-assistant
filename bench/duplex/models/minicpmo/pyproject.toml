[project]
name = "dx-minicpmo"
version = "0.1.0"
description = "DX-POC adapter env: MiniCPM-o 4.5 AWQ int4 (transformers remote code, duplex mode)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch==2.6.0",
    "torchaudio==2.6.0",
    "transformers==4.51.0",
    "accelerate==1.10.1",
    "minicpmo-utils[all]==1.0.6",
    "autoawq==0.2.9",
    "numpy==1.26.4",
    "scipy==1.14.1",
    "soundfile==0.12.1",
    "setuptools==75.8.0",
    "flash-attn==2.7.4.post1",
]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }
flash-attn = { url = "https://github.com/Dao-AILab/flash-attention/releases/download/v2.7.4.post1/flash_attn-2.7.4.post1+cu12torch2.6cxx11abiFALSE-cp311-cp311-linux_x86_64.whl" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv]
package = false
